name: Build and deploy

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  push:
    branches: [main]
  pull_request: # build only, as a check; deploy runs only on main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run takes about 1.5 minutes (a first, uncached clone a little longer).
    timeout-minutes: 15
    outputs:
      built: ${{ steps.plan.outputs.built }}
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v7

      # Keep the blobless drupal/drupal clone between runs so each build only fetches new history.
      - uses: actions/cache@v6
        with:
          path: data/drupal
          key: drupal-clone-${{ github.run_id }}
          restore-keys: drupal-clone-

      # The newest drupal/drupal commit touching a baseline file. A scheduled run whose newest commit
      # was already deployed has nothing new to publish.
      - id: stamp
        run: |
          [ -d data/drupal ] || git clone --filter=blob:none --no-checkout https://github.com/drupal/drupal.git data/drupal
          git -C data/drupal fetch -q origin
          echo "stamp=$(git -C data/drupal log -1 --format=%H origin/main -- core/phpstan-baseline.neon core/.phpstan-baseline.php)" >> "$GITHUB_OUTPUT"

      - id: seen
        uses: actions/cache/restore@v6
        with:
          path: .build-stamp
          key: built-${{ steps.stamp.outputs.stamp }}
          lookup-only: true

      - id: plan
        run: |
          if [ "${{ steps.seen.outputs.cache-hit }}" = true ] && [ "${{ github.event_name }}" = schedule ]; then
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No baseline changes since the last deploy (${{ steps.stamp.outputs.stamp }}); skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build data
        if: steps.plan.outputs.built == 'true'
        run: ./build.sh

      - name: Check data
        if: steps.plan.outputs.built == 'true'
        run: |
          python3 -c "
          import json
          d = json.load(open('app/data.json'))
          assert len(d['commits']) > 600, 'too few commits'
          assert d['currentByIdentifier'], 'no identifiers at HEAD'
          print(len(d['commits']), 'commits, latest total', d['commits'][-1]['total'])
          "

      - if: steps.plan.outputs.built == 'true' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: steps.plan.outputs.built == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

  deploy:
    if: needs.build.outputs.built == 'true' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Remember what was deployed so the next scheduled run can skip when nothing changed.
      - run: echo "${{ needs.build.outputs.stamp }}" > .build-stamp
      - uses: actions/cache/save@v6
        with:
          path: .build-stamp
          key: built-${{ needs.build.outputs.stamp }}
