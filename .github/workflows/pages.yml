name: Build and deploy

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  push:
    branches: [main]
  pull_request: # build only, as a check; deploy runs only on main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep the blobless drupal/drupal clone between runs so each build only fetches new history.
      - uses: actions/cache@v6
        with:
          path: data/drupal
          key: drupal-clone-${{ github.run_id }}
          restore-keys: drupal-clone-

      - name: Build data
        run: ./build.sh

      - name: Check data
        run: |
          python3 -c "
          import json
          d = json.load(open('app/data.json'))
          assert len(d['commits']) > 600, 'too few commits'
          assert d['currentByIdentifier'], 'no identifiers at HEAD'
          print(len(d['commits']), 'commits, latest total', d['commits'][-1]['total'])
          "

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
