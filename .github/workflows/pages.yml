name: Build and deploy

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the blobless drupal/drupal clone between runs so each build only fetches new history.
      - uses: actions/cache@v4
        with:
          path: data/drupal
          key: drupal-clone-${{ github.run_id }}
          restore-keys: drupal-clone-

      - name: Build data
        run: ./build.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
